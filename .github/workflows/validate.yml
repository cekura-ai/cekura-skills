name: validate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate JSON manifests
        run: |
          for f in .claude-plugin/marketplace.json .cursor-plugin/marketplace.json \
                   .agents/plugins/marketplace.json gemini-extension.json package.json \
                   cekura/.claude-plugin/plugin.json cekura/.codex-plugin/plugin.json \
                   cekura/.cursor-plugin/plugin.json cekura/.mcp.json cekura/codex-mcp.json \
                   cekura/ack-tags.json cekura/hooks/hooks.json cekura/hooks/codex-hooks.json; do
            python3 -m json.tool "$f" > /dev/null || { echo "invalid JSON: $f"; exit 1; }
          done

      - name: Ack tags and plugin_version consistency
        run: python3 cekura/scripts/validate_ack_tags.py

      - name: Bundles up to date
        run: python3 cekura/scripts/build_bundles.py --check

      - name: Gemini context file in sync
        run: diff codex/AGENTS.md GEMINI.md

      - name: Skill frontmatter limits (Agent Skills spec)
        run: |
          python3 - << 'EOF'
          import re, sys, pathlib
          errors = []
          for f in sorted(pathlib.Path('cekura/skills').glob('*/SKILL.md')):
              text = f.read_text()
              m = re.match(r'---\n(.*?)\n---\n', text, re.S)
              if not m:
                  errors.append(f"{f}: missing frontmatter"); continue
              fm = m.group(1)
              nm = re.search(r'^name:\s*(\S+)', fm, re.M)
              if not nm or nm.group(1) != f.parent.name:
                  errors.append(f"{f}: name must match directory ({f.parent.name})")
              dm = re.search(r'^description:\s*[|>]?\n?((?:  .+\n?)+|.+)', fm, re.M)
              desc = ' '.join(l.strip() for l in dm.group(1).strip().splitlines()) if dm else ''
              if not desc:
                  errors.append(f"{f}: missing description")
              elif len(desc) > 1024:
                  errors.append(f"{f}: description {len(desc)} chars > 1024")
              n = len(text.splitlines())
              if n > 500:
                  errors.append(f"{f}: {n} lines > 500")
              if 'cekura-internal:' in text:
                  errors.append(f"{f}: references internal plugin (cekura-internal:*)")
          if errors:
              print('\n'.join(errors)); sys.exit(1)
          print('skill frontmatter OK')
          EOF

      - name: Version consistency and bump enforcement
        run: |
          python3 - << 'EOF'
          import json, subprocess, sys
          plugin = json.load(open('cekura/.claude-plugin/plugin.json'))['version']
          pkg = json.load(open('package.json'))['version']
          mkt = json.load(open('.claude-plugin/marketplace.json'))
          if plugin != pkg:
              sys.exit(f"plugin.json {plugin} != package.json {pkg}")
          for entry in mkt.get('plugins', []):
              if 'version' in entry:
                  sys.exit("marketplace plugin entry must not declare a version - plugin.json is the single source")
          # bump enforcement: if cekura/** changed vs the merge base, plugin.json version must change too
          base = subprocess.run(['git', 'merge-base', 'origin/main', 'HEAD'],
                                capture_output=True, text=True).stdout.strip()
          if base:
              changed = subprocess.run(['git', 'diff', '--name-only', base, 'HEAD'],
                                       capture_output=True, text=True).stdout.splitlines()
              plugin_content_changed = any(f.startswith('cekura/') for f in changed)
              old = subprocess.run(['git', 'show', f'{base}:cekura/.claude-plugin/plugin.json'],
                                   capture_output=True, text=True)
              old_version = json.loads(old.stdout)['version'] if old.returncode == 0 else None
              if plugin_content_changed and old_version == plugin:
                  sys.exit(f"cekura/** changed but plugin.json version is still {plugin} - bump it "
                           "(users only receive updates when the version changes)")
          print(f'version OK: {plugin}')
          EOF
