name: validate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate JSON files
        run: |
          git ls-files '*.json' | xargs python3 -c '
          import json, sys
          bad = []
          for f in sys.argv[1:]:
              try:
                  json.load(open(f))
              except Exception as e:
                  bad.append(f"{f}: {e}")
          if bad:
              print("\n".join(bad)); sys.exit(1)
          print(f"{len(sys.argv) - 1} JSON files OK")
          '

      - name: Ack tags and plugin_version consistency
        run: python3 cekura/scripts/validate_ack_tags.py

      - name: Skills, versions, MCP URLs, docs inventory
        run: python3 cekura/scripts/validate_skills.py

      - name: Bundles up to date
        run: python3 cekura/scripts/build_bundles.py --check

      - name: Gemini context file in sync
        run: diff codex/AGENTS.md GEMINI.md

      - name: claude plugin validate (strict)
        run: |
          npm install -g @anthropic-ai/claude-code
          claude plugin validate ./cekura --strict
          claude plugin validate . --strict

      - name: Version bump required for plugin-content changes
        if: github.event_name == 'pull_request'
        run: |
          python3 - << 'EOF'
          import json, subprocess, sys
          base = subprocess.run(['git', 'merge-base', 'origin/main', 'HEAD'],
                                capture_output=True, text=True, check=True).stdout.strip()
          changed = subprocess.run(['git', 'diff', '--name-only', base, 'HEAD'],
                                   capture_output=True, text=True, check=True).stdout.splitlines()
          plugin_files = [f for f in changed if f.startswith('cekura/')]
          if not plugin_files:
              print('no cekura/** changes; bump not required')
              sys.exit(0)
          version = json.load(open('cekura/.claude-plugin/plugin.json'))['version']
          old = subprocess.run(['git', 'show', f'{base}:cekura/.claude-plugin/plugin.json'],
                               capture_output=True, text=True)
          old_version = json.loads(old.stdout)['version'] if old.returncode == 0 else None
          if old_version == version:
              print(f"plugin content changed but plugin.json version is still {version} - "
                    "bump it (users only receive updates when the version changes).")
              print("changed cekura/** files:")
              for f in plugin_files:
                  print(f"  - {f}")
              sys.exit(1)
          print(f'version bumped: {old_version} -> {version}')
          EOF
